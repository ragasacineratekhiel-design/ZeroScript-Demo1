name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt

      - name: Install verification deps
        run: npm ci --ignore-scripts

      - name: Bridge syntax & mirror parity
        run: |
          bash tools/sync-bridge.sh
          python3 scripts/sync_copies.py --check
          python3 - <<'PY'
          import ast, pathlib
          for p in pathlib.Path("ZeroScript Demo/ZeroScript-Free-1.5.5").glob("*.py"):
              ast.parse(p.read_text(encoding="utf-8"))
              print("parsed", p)
          PY

      - name: Verification suite
        run: npm run verify

      - name: Deep AST defect audit (zero P0/P1/P2)
        run: node tools/audit-deep.js

      - name: No empty catch blocks (independent of the verifier)
        run: |
          n=$(grep -rEn 'catch[[:space:]]*(\([^)]*\))?[[:space:]]*\{[[:space:]]*\}'                 --include='*.js' zeroscript-extension-v2                 | grep -v 'core/safe.js' | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*)' | wc -l)
          if [ "$n" -ne 0 ]; then
            echo "::error::$n empty catch block(s) — use globalThis.ZSSafe?.seen?.(site, e)"
            grep -rEn 'catch[[:space:]]*(\([^)]*\))?[[:space:]]*\{[[:space:]]*\}' --include='*.js' zeroscript-extension-v2 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*)' | head -10
            exit 1
          fi
          echo "0 empty catch blocks"

      - name: No secrets or logs committed
        run: |
          if git ls-files | grep -E '(^|/)\.zs_token$|(^|/)logs/.*\.log$'; then
            echo "::error::token or log file is tracked; it must stay git-ignored"
            exit 1
          fi
          echo "clean"
