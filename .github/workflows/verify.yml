name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements-dev.txt

      - name: Install verification deps
        run: npm install --no-audit --no-fund

      - name: Bridge syntax (canonical copy + symlink)
        run: |
          bash tools/sync-bridge.sh
          python3 - <<'PY'
          import ast, sys, pathlib
          canon = pathlib.Path("ZeroScript Demo/ZeroScript-Free-1.5.5/bridge.py")
          link  = pathlib.Path("ZeroScript Demo/bridge.py")
          for p in (canon, link):
              ast.parse(p.read_text(encoding="utf-8"))
              print("parsed", p)
          if canon.read_text(encoding="utf-8") != link.read_text(encoding="utf-8"):
              sys.exit("bridge copies have drifted — run tools/sync-bridge.sh")
          PY

      - name: Verification suite
        run: npm run verify

      - name: No empty catch blocks (independent of the verifier)
        run: |
          # Deliberately duplicated with tools/verify.js [4d]: this is the one
          # property that silently regresses without anyone noticing.
          # exclude comments: prose that mentions `catch {}` is not a catch block
          n=$(grep -rEn 'catch[[:space:]]*(\([^)]*\))?[[:space:]]*\{[[:space:]]*\}' \
                --include='*.js' zeroscript-extension-v2 \
                | grep -v 'core/safe.js' | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*)' | wc -l)
          if [ "$n" -ne 0 ]; then
            echo "::error::$n empty catch block(s) — use globalThis.ZSSafe?.seen?.(site, e)"
            grep -rEn 'catch[[:space:]]*(\([^)]*\))?[[:space:]]*\{[[:space:]]*\}' --include='*.js' zeroscript-extension-v2 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*)' | head -10
            exit 1
          fi
          echo "0 empty catch blocks"

      - name: No secrets or logs committed
        run: |
          if git ls-files | grep -E '(^|/)\.zs_token$|(^|/)logs/.*\.log$'; then
            echo "::error::token or log file is tracked; it must stay git-ignored"
            exit 1
          fi
          echo "clean"
